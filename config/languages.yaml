# Languages offered on the profile form, and the codes the LLM uses for a job's required languages.
# Codes are the standard ISO 639 ones: two letters where one exists, otherwise three (Cantonese: yue).
# Every language named in countries.yaml (local_languages) must be listed here.

languages:
